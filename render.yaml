# Render.com deployment configuration
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: keep-me-alive
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    # Render automatically injects PORT; the container binds to it.
    # Set ADMIN_PASSWORD, GIST_TOKEN, and GIST_ID as secret env vars in the dashboard.
    envVars:
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
