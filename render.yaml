# Render.com deployment configuration (optional; Portainer uses the image directly)
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: keep-me-alive
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    # Render injects PORT; the container binds to it.
    # Set ADMIN_PASSWORD, GIST_TOKEN and GIST_ID as secret env vars in the dashboard.
