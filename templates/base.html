<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Keep Me Alive{% endblock %}</title>
<style>
  :root {
    --bg: #12121f; --card: #1a1a2e; --card-2: #16213e;
    --line: rgba(255,255,255,.09); --text: #e8eaf2; --muted: #8b93a7;
    --accent: #00d9ff; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 28px 20px 60px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .brand {
    font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0;
    background: linear-gradient(90deg, #22d3ee, #34d399);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .metric { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .metric .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .metric .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .metric .note { color: var(--muted); font-size: 12px; }

  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill-ok { background: rgba(52,211,153,.14); color: var(--ok); border: 1px solid rgba(52,211,153,.35); }
  .pill-warn { background: rgba(251,191,36,.14); color: var(--warn); border: 1px solid rgba(251,191,36,.35); }
  .pill-bad { background: rgba(248,113,113,.14); color: var(--bad); border: 1px solid rgba(248,113,113,.35); }
  .pill-mute { background: rgba(255,255,255,.06); color: var(--muted); border: 1px solid var(--line); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  td.num { white-space: nowrap; color: var(--muted); }
  tr:last-child td { border-bottom: none; }

  .site-name { font-weight: 600; }
  .site-url { color: var(--muted); font-size: 12.5px; word-break: break-all; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  button, .btn {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: rgba(255,255,255,.06); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px;
    transition: border-color .12s ease, background .12s ease;
  }
  button:hover { border-color: rgba(0,217,255,.6); background: rgba(0,217,255,.08); }
  button.primary { background: rgba(0,217,255,.14); border-color: rgba(0,217,255,.45); color: #bdf3ff; }
  button.danger:hover { border-color: rgba(248,113,113,.6); background: rgba(248,113,113,.1); }
  button.ghost { background: transparent; }

  form.inline { display: inline; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 9px 11px; border-radius: 9px; font: inherit;
    background: var(--card-2); color: var(--text); border: 1px solid var(--line);
  }
  input:focus, select:focus { outline: none; border-color: rgba(0,217,255,.6); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 12px; align-items: end; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 6px; }

  .flash { padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px;
           background: rgba(0,217,255,.1); border: 1px solid rgba(0,217,255,.35); color: #bdf3ff; }
  .flash.warn { background: rgba(251,191,36,.1); border-color: rgba(251,191,36,.4); color: #fde68a; }
  .result { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--card-2); }
  .result .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .result img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--line); }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  footer.note { color: var(--muted); font-size: 12.5px; margin-top: 26px; }
  @media (max-width: 760px) {
    .metrics { grid-template-columns: 1fr 1fr; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
</body>
</html>
